name: Publish Package

on:
  release:
    types: [created]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # Verify the version before publishing
      - name: Check package version
        run: |
          echo "Package version from package.json:"
          node -p "require('./package.json').version"
          echo "Git ref: ${{ github.ref }}"

      # Ensure pnpm authenticates to the npm registry. OIDC trusted publishing is
      # preferred; when it is unavailable fall back to the NPM_TOKEN secret.
      - name: Configure npm auth
        run: |
          npm config set @immahq:registry https://registry.npmjs.org/
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" >> .npmrc
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
